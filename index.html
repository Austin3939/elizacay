<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/botanical.png" type="image/png" />
    <link rel="apple-touch-icon" href="/images/botanical.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="eliza cay — block printing and illustration by Liz, a queer visual artist in Grand Rapids, Michigan. Limited prints, apparel, and commissions." />
    <link rel="canonical" href="https://elizacaystudio.com" />
    <title>eliza cay</title>

    <!-- Fallback social tags. Per-page routes override these at runtime;
         prerendered routes get their own baked in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eliza cay" />
    <meta property="og:title" content="eliza cay" />
    <meta property="og:description" content="Block printing and illustration by Liz, a queer visual artist in Grand Rapids, Michigan. Limited-edition prints, apparel, and commission work." />
    <meta property="og:url" content="https://elizacaystudio.com" />
    <meta property="og:image" content="https://elizacaystudio.com/images/logo-full.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="eliza cay" />
    <meta name="twitter:description" content="Block printing and illustration by Liz, a queer visual artist in Grand Rapids, Michigan." />
    <meta name="twitter:image" content="https://elizacaystudio.com/images/logo-full.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Cormorant+SC:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify Forms detects forms in static HTML at deploy time. The real
         form is rendered by React (src/pages/Commission.jsx) and submits via
         fetch; this hidden copy just registers the "commission" form + fields. -->
    <form name="commission" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="commission" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="type" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <textarea name="description"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
